[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-framework"
version = "1.1.3"
description = "Agent Utility and Dependency Intervention Testing for software engineering agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
figures = ["matplotlib==3.10.8", "pypdf==6.8.0"]

[project.scripts]
audit-framework = "audit_framework.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

